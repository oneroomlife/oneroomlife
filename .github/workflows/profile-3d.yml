name: 🧊 Update 3D Contribution Graph

on:
  schedule:
    # 每天 00:30 UTC（北京时间 08:30）刷新一次
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution SVG
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name "oneroomlife"
          git config user.email "147360129+oneroomlife@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: update 3D contribution graph"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push retry $i"; sleep $((i * 3))
          done
